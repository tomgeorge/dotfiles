#:schema https://fut.sh/schemas/config.json

# `fut project NAME` falls back to ~/git/NAME.
projects_dir = "~/git"

# Bundled extensions, linked from the fut package by nix (dev.nix).
extensions = [
  "~/.config/fut/extensions/wt",
  "~/.config/fut/extensions/ghostty-title",
]

# Explicit entries are what Ctrl-a S suggests; the fallback above only
# resolves exact names.
[projects.dotfiles]
path = "~/git/dotfiles"

[projects.fut]
path = "~/git/fut"

[projects.supper-club]
path = "~/git/supper-club"

[projects.nrepl-lsp]
path = "~/git/nrepl-lsp"

[projects.biff]
path = "~/git/biff"

[projects.mcp-hey]
path = "~/git/mcp-hey"

[projects.homelab]
path = "~/git/homelab"

# Pops lazygit over the panes in the focused pane's directory.
[trusted_commands.lazygit]
title = "lazygit"
binding = "g"
program = "/etc/profiles/per-user/tgeorge/bin/lazygit"
size = { width = 160, height = 45 }

# Otherwise panes run $SHELL, which is zsh on macOS: nix-darwin doesn't change
# the login shell (see TODO.md). terminal.shell comes from my fork's trunk.
[terminal]
shell = "/run/current-system/sw/bin/fish"

# Pass a BEL to Ghostty when a terminal inside fut rings. Agent lifecycle
# reports alone don't trigger it (fut 0.32), only real terminal bells.
[alerts]
signal_outer_terminal = true

[ui]
# Same prefix as herdr and WezTerm.
prefix = "ctrl-a"

[ui.bindings]
# Mirror herdr's split keys; the defaults (| and _) keep working too.
split_pane_down = "-"
split_pane_right = "v"
# The palette has these but they ship unbound.
rename_tab = "r"
rename_workspace = "W"
"wt:new-worktree" = "N"

[ui.icons]
# Ghostty and WezTerm both bundle the Nerd Font symbols, so this works with
# any font.
preset = "nerd_font"

# The default right sidebar shows only the focused session's agents; list
# every session's so blocked/finished agents elsewhere stay visible. Global
# rows get cramped on one line, so the row splits source from status and
# location (which gains the session name once rows span sessions).
[ui.sidebar.right]
components = [
  { component = "agents", size = "fill", scope = "global", row = { left = [{ text = " " }], body = [{ token = "agent.source" }], right = [{ token = "agent.activity" }, { text = " " }], detail = [{ text = "  " }, { token = "agent.status" }, { token = "agent.location", style = "muted", prefix = " · " }] } },
]

[ui.spinner]
style = "dots"

[ui.tab_bar]
# position = "bottom"
# Lanes replace the defaults wholesale, so these restate them. Added: the
# session name on the left, and session.waiting beside client.waiting.
# Styles must be semantic roles, so session.waiting borrows workspace's
# blue to tell "this session" from peach "every session".
left = [
  { segments = [{ token = "session.name", prefix = " ", suffix = " ", max_width = 20 }], style = "session", priority = 210 },
  { segments = [{ component = "tabs" }], priority = 100 },
]
right = [
  { segments = [{ token = "workspace.name", prefix = " ", suffix = " ", max_width = 20 }], style = "muted", priority = 200 },
  { segments = [{ token = "client.zoom", suffix = " " }], priority = 255 },
  { segments = [{ token = "client.help" }], style = "muted", priority = 0 },
  { segments = [{ token = "fut" }], style = "muted", priority = 0 },
  { segments = [{ token = "session.waiting", prefix = " " }], style = "workspace", priority = 255 },
  { segments = [{ token = "client.waiting", prefix = " ", suffix = " " }], style = "attention", priority = 255 },
]

# The default item plus tab.progress, which shows NN% only while a program
# reports determinate progress.
[ui.tab_bar.item]
segments = [
  { text = " " },
  { token = "tab.index" },
  { token = "tab.name", prefix = " " },
  { token = "tab.closing", prefix = " " },
  { token = "tab.activity", prefix = " " },
  { token = "tab.progress", prefix = " ", style = "muted" },
  { text = " " },
]

# Catppuccin Frappe, matching Ghostty and herdr. Each table replaces the
# whole default style, so modifiers are restated.
[ui.styles.muted]
foreground = "#838ba7" # overlay1

# Hierarchy fades from accent to text, as Catppuccin's own ports do. The
# navigator's selected row reverses these (it ignores ui.styles.selected),
# so they double as its highlight colors.
[ui.styles.session]
foreground = "#ca9ee6" # mauve
add_modifiers = ["bold"]

[ui.styles.workspace]
foreground = "#8caaee" # blue

[ui.styles.tab]
foreground = "#babbf1" # lavender

[ui.styles.pane]
foreground = "#a5adce" # subtext0

[ui.styles.current]
foreground = "#ca9ee6" # mauve
add_modifiers = ["reversed", "bold"]
remove_modifiers = ["underlined"]

[ui.styles.selected]
background = "#414559" # surface0
remove_modifiers = ["reversed"]

[ui.styles.closing]
foreground = "#737994" # overlay0
add_modifiers = ["crossed_out"]

[ui.styles.activity]
foreground = "#99d1db" # sky

[ui.styles.attention]
foreground = "#ef9f76" # peach
add_modifiers = ["bold"]

[ui.styles.error]
foreground = "#e78284" # red
add_modifiers = ["bold"]

[ui.styles.divider]
foreground = "#51576d" # surface1

[ui.styles.added]
foreground = "#a6d189" # green

[ui.styles.deleted]
foreground = "#e78284" # red

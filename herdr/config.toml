onboarding = false

[terminal]
default_shell = "fish"

[worktrees]
directory = "~/git/.worktrees"

[session]
resume_agents_on_restore = true

# Default is "off", which silently drops plugin notification.show toasts
# (the API still reports shown: true). Agent toasts only fire for tabs not
# in view.
[ui.toast]
delivery = "herdr"

[experimental]
# Terminal output can contain secrets; do not persist screen history.
pane_history = false

# Plugin actions are "<plugin id>.<action id>"; the plugin must be linked
# (`make link` in go-herdrkit/) for the binding to resolve.
[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "go-herdrkit.ping.ping"
description = "ping herdr"

onboarding = false

[terminal]
default_shell = "fish"

[worktrees]
directory = "~/git/worktrees"

[session]
resume_agents_on_restore = true

[ui]
tab_bar_position = "bottom"
status_indicators = "symbols"

# Default is "off", which silently drops plugin notification.show toasts
# (the API still reports shown: true). Agent toasts only fire for tabs not
# in view.
[ui.toast]
delivery = "herdr"

[experimental]
# Terminal output can contain secrets; do not persist screen history.
pane_history = false

[keys]
prefix = "ctrl+a"
copy_mode = "prefix+y" # frees prefix+[ for tg.nav.tab-prev
split_horizontal = ["prefix+minus", "prefix+'"]
split_vertical = ["prefix+v", "prefix+%"] # not shift+5: herdr matches the character
zoom = ["prefix+z", "prefix+o"]
rename_pane = "prefix+shift+e" # its default, prefix+shift+p, is tg.find's
# focus_pane_* keep their prefix+h/j/k/l defaults: a fallback when tg.nav
# isn't linked (`make link` in herdr-plugins/).

# tg.nav: ctrl+hjkl and prefix+]/[ move through nvim, herdr and WezTerm.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "tg.nav.left"
description = "navigate left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "tg.nav.down"
description = "navigate down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "tg.nav.up"
description = "navigate up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "tg.nav.right"
description = "navigate right"

[[keys.command]]
key = "prefix+]"
type = "plugin_action"
command = "tg.nav.tab-next"
description = "next tab"

[[keys.command]]
key = "prefix+["
type = "plugin_action"
command = "tg.nav.tab-prev"
description = "previous tab"

# tg.find: one picker over workspaces, live agents, worktrees and, behind a
# leading `/`, zoxide dirs. The popup's size is in the plugin's manifest.
[[keys.command]]
key = "prefix+shift+p"
type = "shell"
command = '"$HERDR_BIN_PATH" plugin pane open --plugin tg.find --entrypoint picker'
description = "find a workspace, agent, worktree or dir"

# ctrl+l is taken by tg.nav; this sends a literal one to clear the screen.
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = '"$HERDR_BIN_PATH" pane send-keys "$HERDR_ACTIVE_PANE_ID" ctrl+l'
description = "clear screen"

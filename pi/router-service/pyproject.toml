[project]
name = "pi-router"
version = "0.1.0"
description = "Local System 1 model router for pi subagents (Laya and Arch-Router)"
requires-python = ">=3.12"
dependencies = [
  "laya==0.3.22",
  "torch>=2.4",
  "transformers>=4.48",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.scripts]
pi-router-serve = "pi_router.service:main"
pi-router-warm = "pi_router.service:warm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
